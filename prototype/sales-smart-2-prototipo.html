<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sales Smart 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar de módulos + área de trabajo con paneles laterales (CRM B2B, denso pero legible).
   Color: neutros azulados + un acento verde-azulado; semánticos aparte (ok/aviso/crítico).
   Tipo: Bricolage Grotesque (títulos), IBM Plex Sans (UI), IBM Plex Mono (cifras, variables). */
:root{
  --bg:#F4F2FC; --surface:#FFFFFF; --surface2:#EEEBFA; --line:#E2DEF2; --fg:#16112E; --muted:#5F5A7A;
  --accent:#6A44F2; --accent-soft:#ECE6FF; --accent-ink:#FFFFFF;
  --ok:#1B7F48; --ok-soft:#DCF1E5; --warn:#9A6200; --warn-soft:#F8EBCC; --crit:#B3341F; --crit-soft:#F8DDD7;
  --info:#2B5BB8; --info-soft:#DEE8F8; --shadow:0 10px 34px rgba(60,40,140,.14);
  --f-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --f-ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0A1F; --surface:#171230; --surface2:#211A42; --line:#30275A; --fg:#EEEAFB; --muted:#A39CC4;
  --accent:#9B7BFF; --accent-soft:#2D2260; --accent-ink:#120A33;
  --ok:#5BD08A; --ok-soft:#14331F; --warn:#E8B04A; --warn-soft:#3A2D10; --crit:#F0836F; --crit-soft:#3E1B15;
  --info:#8DB0F5; --info-soft:#1B2A55; --shadow:0 10px 34px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0A1F; --surface:#171230; --surface2:#211A42; --line:#30275A; --fg:#EEEAFB; --muted:#A39CC4;
  --accent:#9B7BFF; --accent-soft:#2D2260; --accent-ink:#120A33;
  --ok:#5BD08A; --ok-soft:#14331F; --warn:#E8B04A; --warn-soft:#3A2D10; --crit:#F0836F; --crit-soft:#3E1B15;
  --info:#8DB0F5; --info-soft:#1B2A55; --shadow:0 10px 34px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13.5px;line-height:1.45;margin:0;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:15px} h3{font-size:13.5px;font-family:var(--f-ui);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:12px} .xs{font-size:11px}
.up{text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;color:var(--muted);font-weight:600}

#app{display:grid;grid-template-columns:228px minmax(0,1fr);height:100%}
#side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto}
.brand{padding:16px 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px}
.brand b{font-family:var(--f-display);font-size:15px}
.org{margin:4px 12px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.org .sm{display:flex;justify-content:space-between;gap:6px}
nav{display:flex;flex-direction:column;gap:1px;padding:4px 8px}
nav .grp{margin:10px 8px 4px}
nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:7px 8px;border-radius:7px;text-align:left;color:var(--muted)}
nav button:hover{background:var(--surface2);color:var(--fg)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav svg{width:16px;height:16px;flex:none}
nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--crit-soft);color:var(--crit);padding:0 6px;border-radius:9px}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
#stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.topbar .grow{flex:1;min-width:0}
.banner{background:var(--warn-soft);color:var(--warn);padding:5px 20px;font-size:12px;border-bottom:1px solid var(--line)}
#main{flex:1;min-height:0;overflow:auto;padding:20px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h p{margin:2px 0 0;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 11px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dng{color:var(--crit)} .btn.sm{padding:3px 8px;font-size:12px}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;min-width:0;width:100%}
textarea.inp{resize:vertical;line-height:1.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card.pad{padding:14px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi .v{font-family:var(--f-mono);font-size:24px;font-weight:500;margin-top:4px}
.kpi .d{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--surface2);color:var(--muted);white-space:nowrap;font-weight:500}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.tbl-wrap{overflow:auto;border-radius:10px}
table{border-collapse:collapse;width:100%}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap;position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.row{cursor:pointer} tr.row:hover td{background:var(--surface2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--accent);font-weight:600}
.row-flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.sw{position:relative;width:34px;height:20px;border-radius:10px;background:var(--line);border:0;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw.on{background:var(--accent)} .sw.on::after{transform:translateX(14px)}

/* Kanban */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow:auto;padding-bottom:8px}
.col{background:var(--surface2);border-radius:10px;padding:8px;min-height:240px}
.col.over{outline:2px dashed var(--accent)}
.col h3{display:flex;justify-content:space-between;padding:4px 6px 8px}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:grab}
.opp:hover{border-color:var(--accent)}
.opp .f{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:3px}
.opp .f span:first-child{color:var(--muted)}

/* Drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .2s;z-index:20;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
#drawer .body{padding:14px 16px;overflow:auto;flex:1}
.fld{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.fld label{color:var(--muted);font-size:12px}
.fld.ovr label::after{content:" ·editado";color:var(--warn);font-size:10px}
.iconbtn{border:0;background:transparent;padding:4px;border-radius:5px;color:var(--muted);display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--surface2);color:var(--fg)} .iconbtn svg{width:15px;height:15px}

/* Inbox */
.inbox{display:grid;grid-template-columns:290px minmax(0,1fr) 290px;gap:0;height:calc(100vh - 150px);min-height:480px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.inbox>div{min-height:0;overflow:auto}
.convs{border-right:1px solid var(--line)}
.conv{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:3px}
.conv:hover{background:var(--surface2)} .conv.on{background:var(--accent-soft)}
.thread{display:flex;flex-direction:column;overflow:hidden!important}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.m{max-width:74%;padding:7px 11px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.m.out{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.m.ai{align-self:flex-end;background:var(--info-soft);border-color:transparent}
.m small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
.composer{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}
.ctx{border-left:1px solid var(--line);padding:14px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.kv span:first-child{color:var(--muted)}
.sla{font-family:var(--f-mono);font-size:11px}

.pipe{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pipe .st{padding:3px 9px;border-radius:6px;background:var(--surface2);color:var(--muted);font-size:12px}
.pipe .st.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.pipe .st.done{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.code{font-family:var(--f-mono);font-size:12px;background:var(--surface2);padding:2px 6px;border-radius:5px}
.var{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:1px 6px;cursor:pointer}
.var:hover{border-color:var(--accent);color:var(--accent)}
.preview{background:var(--surface2);border-radius:8px;padding:10px;white-space:pre-wrap;font-size:12.5px}
.preview mark{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 3px}
.preview b.v{color:var(--accent);font-weight:600}
.rule{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.rule:last-child{border:0}
.tok{display:inline-block;padding:1px 7px;border-radius:5px;font-size:12px;font-weight:600;margin:1px}
.tok.t{background:var(--info-soft);color:var(--info)} .tok.c{background:var(--warn-soft);color:var(--warn)} .tok.a{background:var(--ok-soft);color:var(--ok)}
.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:210px}
.dial button{padding:9px 0;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--f-mono);font-size:15px}
.dial button:hover{background:var(--surface2)}
.callbox{border-radius:10px;padding:14px;background:var(--surface2)}
.callbox.live{background:var(--ok-soft)}
.timer{font-family:var(--f-mono);font-size:26px}
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
.list>button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent}
.list>button:hover{background:var(--surface2)} .list>button.on{background:var(--accent-soft)}
.colmenu{position:absolute;right:0;top:36px;z-index:5;width:250px;padding:8px;box-shadow:var(--shadow)}
.colmenu label{display:flex;gap:8px;align-items:center;padding:3px 4px}
.stepper{display:flex;gap:0;align-items:center;flex-wrap:wrap}
.stepper .s{padding:3px 9px;font-size:11.5px;background:var(--surface2);color:var(--muted);margin-right:2px;border-radius:5px;transition:.2s}
.stepper .s.on{background:var(--accent);color:var(--accent-ink)}
.stepper .s.done{background:var(--accent-soft);color:var(--accent)}
svg.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.on{opacity:1}

.m.note{align-self:center;background:var(--warn-soft);color:var(--warn);border-color:transparent}
.canvas{position:relative;min-width:1290px;height:400px;background:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px;border-radius:10px}
.canvas svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.canvas path{fill:none;stroke:var(--muted);stroke-width:1.5}
.canvas .elab{font-size:11px;fill:var(--accent);font-weight:600;font-family:var(--f-ui)}
.node{position:absolute;width:168px;min-height:54px;padding:8px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);border-left-width:4px;cursor:pointer;font-size:12px}
.node.sel{outline:2px solid var(--accent)}
.node b{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.n-start{border-left-color:var(--ok)} .n-msg{border-left-color:var(--info)} .n-q{border-left-color:var(--info)} .n-logic{border-left-color:var(--warn)} .n-crm{border-left-color:var(--accent)} .n-ai{border-left-color:#8A5CD6} .n-int{border-left-color:var(--crit)}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12px}
.pal button:hover{border-color:var(--accent);color:var(--accent)}
.cov-row td{vertical-align:top}
/* ===== Inbox estilo WhatsApp Business ===== */
:root{--wa-bg:#EFEAE2;--wa-in:#FFFFFF;--wa-out:#D9FDD3;--wa-ink:#111B21;--wa-green:#1FA855;--wa-tick:#53BDEB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wa-bg:#0B141A;--wa-in:#202C33;--wa-out:#005C4B;--wa-ink:#E9EDEF;--wa-green:#25D366}}
:root[data-theme="dark"]{--wa-bg:#0B141A;--wa-in:#202C33;--wa-out:#005C4B;--wa-ink:#E9EDEF;--wa-green:#25D366}
#main.flush{padding:12px}
.inbox{height:calc(100vh - 78px);grid-template-columns:340px minmax(0,1fr) 300px}
.convs{display:flex;flex-direction:column;overflow:hidden!important}
.convs-h{padding:10px 12px 0;border-bottom:1px solid var(--line);background:var(--surface)}
.convs-h .inp{border-radius:20px;background:var(--surface2);border-color:transparent;padding:7px 12px}
.itabs{display:flex;margin-top:6px}
.itabs button{flex:1;border:0;background:transparent;padding:8px 2px;color:var(--muted);border-bottom:2px solid transparent;font-weight:500;display:flex;gap:5px;justify-content:center;align-items:center}
.itabs button.on{color:var(--fg);border-color:var(--accent);font-weight:600}
.itabs .n{min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 5px}
.itabs button:not(.on) .n{background:var(--surface2);color:var(--muted)}
.clist{flex:1;overflow:auto}
.cv{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.cv:hover{background:var(--surface2)} .cv.on{background:var(--accent-soft)}
.cv .av,.av.big{width:46px;height:46px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:600;color:var(--muted);position:relative;flex:none}
.cv .av i{position:absolute;right:-1px;bottom:-1px;width:15px;height:15px;border-radius:50%;border:2px solid var(--surface)}
.cv .top{display:flex;gap:6px;align-items:baseline}
.cv .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv .tm{font-size:11px;color:var(--muted)} .cv .tm.unr{color:var(--wa-green);font-weight:600}
.cv .pv{display:flex;gap:6px;align-items:center;color:var(--muted);min-width:0}
.cv .pv .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:4px;align-items:center}
.cv .pv svg{width:13px;height:13px;flex:none}
.cv .tick{color:var(--wa-tick);font-size:11px;letter-spacing:-2px;margin-right:3px}
.badge{min-width:19px;height:19px;border-radius:10px;background:var(--wa-green);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;align-items:center}
.chip{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--muted);line-height:1.2}
.chip.own{background:#16324A;color:#fff} .chip.q{background:var(--line);color:var(--fg)}
.cv .pill.sla{font-size:9.5px;padding:1px 6px}
.thread{background:var(--wa-bg)}
.th-h{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.th-sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.msgs{background-color:var(--wa-bg);background-image:radial-gradient(rgba(127,127,127,.12) 1px,transparent 1px);background-size:16px 16px;padding:14px 8%}
.m{background:var(--wa-in);color:var(--wa-ink);border:0;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.12);max-width:68%;position:relative}
.m.in{align-self:flex-start;border-top-left-radius:2px}
.m.out,.m.ai{align-self:flex-end;background:var(--wa-out);border-top-right-radius:2px}
.m small{text-align:right;color:inherit;opacity:.6}
.m .tick{color:var(--wa-tick);opacity:1;letter-spacing:-2px;margin-left:4px}
.m.note{align-self:center;max-width:80%;background:var(--warn-soft);color:var(--warn);box-shadow:none}
.aud{display:flex;gap:8px;align-items:center;min-width:220px}
.aud .iconbtn{background:var(--surface2);color:var(--fg);width:30px;height:30px;border-radius:50%}
.aud .wave{flex:1;height:18px;background:repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 5px);opacity:.35;-webkit-mask:linear-gradient(90deg,#000 60%,rgba(0,0,0,.4) 60%)}
.trs{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(127,127,127,.4);font-style:italic}
.qrow{display:flex;gap:6px;align-items:center;padding:6px 12px;background:var(--surface);border-top:1px solid var(--line);overflow:auto;white-space:nowrap}
.composer{background:var(--surface);align-items:center;gap:6px;padding:8px 10px}
.composer .inp{border-radius:22px;background:var(--surface2);border-color:transparent;padding:9px 14px}
.composer.note{background:var(--warn-soft)} .composer.note .inp{background:var(--surface)}

/* ---- v7: look premium (referencias: dashboard violeta, hero oscuro, apps móviles) ---- */
:root{--grad:linear-gradient(135deg,#8B67FF 0%,#5B3FE0 100%);--hero:linear-gradient(135deg,#1A1238 0%,#3A2A96 100%);--r:16px}

.inp,select.inp,textarea.inp{border-radius:11px}

.tabs button.on{color:var(--accent);border-color:var(--accent)}
.itabs button.on,.tabs button.on{font-weight:700}
.bar>i{background:var(--grad)}

:root{--vh:100dvh;--vt:0px}

.cmode .sp{flex:1}
.composer{border-top:0!important;position:relative}
.composer.note{background:var(--warn-soft)}
.composer .micb{background:var(--surface2);color:var(--fg)}
.composer #msgin{resize:none;font:inherit;line-height:1.35;min-height:38px;max-height:120px;overflow-y:auto;display:block}
.composer .send{width:auto;min-width:38px;height:38px;border-radius:19px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px}

.pop{position:absolute;left:10px;bottom:74px;width:min(360px,calc(100% - 20px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 44px rgba(20,10,60,.28);padding:10px;z-index:20}

/* ================= v10: popups, sidebar oscuro, temas de color, tipografía, créditos IA ================= */
:root{--on-grad:#fff;--glow:var(--glow);--bar:linear-gradient(180deg,#B9A4FF,#6A44F2);--side-bg:linear-gradient(180deg,#1A1438 0%,#120D2B 100%)}
/* --- temas de color: violeta (por defecto), verde neón, rojo neón --- */
:root[data-brand="green"],.brandc[data-b="green"]{--grad:linear-gradient(135deg,#3CFF93 0%,#00D26A 52%,#00B85C 100%);--on-grad:#03200F;--accent:#00864F;--accent-soft:#D6F8E5;--accent-ink:#03200F}
:root[data-brand="red"],.brandc[data-b="red"]{--grad:linear-gradient(135deg,#FF5C7A 0%,#FF1744 52%,#D5002B 100%);--on-grad:#fff;--accent:#D5002B;--accent-soft:#FFE1E7;--accent-ink:#fff}
:root[data-brand="green"]{--glow:rgba(0,214,110,.4);--bar:linear-gradient(180deg,#7DFFB8,#00C46A);--hero:linear-gradient(135deg,#03150C 0%,#0A5C35 100%);--side-bg:linear-gradient(180deg,#0B1B12 0%,#06110A 100%);
  --bg:#F0F8F3;--surface2:#E6F3EB;--line:#D3E6DA;--fg:#0E1A13;--muted:#547062}
:root[data-brand="red"]{--glow:rgba(255,23,68,.4);--bar:linear-gradient(180deg,#FF9AAE,#FF1744);--hero:linear-gradient(135deg,#1A0509 0%,#8A0F27 100%);--side-bg:linear-gradient(180deg,#1F0A10 0%,#12060A 100%);
  --bg:#FCF2F4;--surface2:#F8E6EA;--line:#EBD0D6;--fg:#1E0E12;--muted:#7A5560}
:root[data-brand="green"][data-theme="dark"]{--bg:#06100A;--surface:#0C1A12;--surface2:#12251A;--line:#1E3A29;--fg:#E8F7EE;--muted:#93B8A3;--accent:#34FF92;--accent-soft:#0F3D25;--accent-ink:#03200F;--shadow:0 10px 34px rgba(0,0,0,.6)}
:root[data-brand="red"][data-theme="dark"]{--bg:#12070A;--surface:#1D0D12;--surface2:#29131A;--line:#45222C;--fg:#FBEAEE;--muted:#C79AA6;--accent:#FF5C7A;--accent-soft:#4A1320;--accent-ink:#1A0409;--shadow:0 10px 34px rgba(0,0,0,.6)}
:root[data-brand="green"][data-theme="dark"] .card{background:linear-gradient(160deg,#0F2017 0%,#0B1811 70%)}
:root[data-brand="red"][data-theme="dark"] .card{background:linear-gradient(160deg,#241016 0%,#1B0C11 70%)}
/* texto sobre rellenos con degradado: oscuro en verde neón, blanco en los demás */
.logo,nav button.on,nav button.on svg,.btn.pri,.btn.pri svg,#tabbar button.on .ti,.tile.on,.tile.on svg,#tabbar .fabb .plus,.pins .ci,.fbtn .n,.drange button.on{color:var(--on-grad)}
.drange button.on,.fbtn .n{background:var(--grad);border-color:transparent}
nav button.on .cnt{background:rgba(0,0,0,.28);color:var(--on-grad)}
.logo{box-shadow:0 6px 16px var(--glow)} nav button.on{box-shadow:0 8px 18px var(--glow)} .btn.pri{box-shadow:0 6px 16px var(--glow)}
.grid.g4>.card.kpi:first-child,.dw.hero{box-shadow:0 14px 34px var(--glow)}
.pins .ci{box-shadow:0 6px 14px var(--glow)}
.dbars i{background:var(--bar)}

/* --- barra lateral siempre oscura (en tema claro y oscuro) --- */
:root[data-theme] #side{background:var(--side-bg);border-right:0;color:#F3F0FF;
  --fg:#F3F0FF;--muted:#A9A3CC;--line:rgba(255,255,255,.1);--surface:rgba(255,255,255,.05);--surface2:rgba(255,255,255,.08)}
#side .brand b{color:#fff}
#side .org{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
#side .inp{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#F3F0FF}
#side select option{color:#16112E;background:#fff}
#side nav .grp{color:#8E88B5}
#side nav button:hover{color:#fff}
#side .iconbtn{color:#A9A3CC} #side .iconbtn:hover{background:rgba(255,255,255,.1);color:#fff}
#side .avatar{background:rgba(255,255,255,.12);color:#fff}

/* --- tipografía más compacta en escritorio --- */
@media (min-width:761px){
  body{font-size:12.5px}
  h1{font-size:21px} h2{font-size:14px} h3{font-size:12.5px}

/* --- ventanas emergentes centradas (antes eran panel lateral) --- */
#dback{position:fixed;inset:0;background:rgba(10,8,25,.55);backdrop-filter:blur(2px);z-index:58;opacity:0;pointer-events:none;transition:opacity .18s}
#dback.on{opacity:1;pointer-events:auto}
#drawer.modal{top:50%;left:50%;right:auto;bottom:auto;height:auto;width:min(540px,94vw);max-height:min(calc(var(--vh) - 32px),860px);transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;border:1px solid var(--line);border-radius:18px;z-index:60;transition:transform .18s,opacity .18s;overflow:hidden}
#drawer.modal.wide{width:min(760px,94vw)}
#drawer.modal.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
#drawer.modal .body{max-height:calc(min(var(--vh) - 32px,860px) - 72px)}
#drawer.modal header{padding:16px 18px}
#drawer.modal .body{padding:16px 18px 18px}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){.fgrid2{grid-template-columns:1fr}}

/* --- panel de datos del contacto: botón y nombre clicable --- */
.inbox.noctx{grid-template-columns:340px minmax(0,1fr)} .inbox.noctx .ctx{display:none}
.ib.on{background:var(--accent-soft);color:var(--accent)}
.thname{cursor:pointer;border-radius:8px;padding:2px 6px;margin:-2px -6px} .thname:hover{background:var(--surface2)}
@media (max-width:1180px){.inbox.noctx{grid-template-columns:320px minmax(0,1fr)}}
@media (max-width:760px){.inbox.noctx{grid-template-columns:minmax(0,1fr)}}

/* --- marcador tipo celular --- */
#dialpop{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(10,8,25,.58);backdrop-filter:blur(2px);padding:12px}
#dialpop.on{display:flex}
.ph{width:min(316px,94vw);max-height:calc(var(--vh) - 24px);overflow:auto;background:linear-gradient(180deg,#191339,#0C091E);color:#F1EEFF;border-radius:36px;padding:14px 18px 22px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 7px #241D4A;text-align:center}
.ph-bar{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#A9A3CC;padding:2px 4px 6px}
.ph-bar button{border:0;background:rgba(255,255,255,.1);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.ph-bar svg{width:15px;height:15px}
.ph-id{font-size:11px;color:#A9A3CC}
.ph-name{height:20px;font-weight:700;font-size:14px;margin-top:10px}
.ph-num{min-height:38px;font-size:24px;letter-spacing:.02em;margin:2px 0 4px;word-break:break-all;line-height:1.25}
.ph-num .ph-ph{font-size:14px;color:#7F79A8;font-family:var(--f-ui)}
.ph-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px;justify-items:center;margin:10px 0 10px}
.ph-keys button{width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.09);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:background .12s}
.ph-keys button:active,.ph-keys button:hover{background:rgba(255,255,255,.18)}
.ph-keys b{font-size:23px;font-weight:500} .ph-keys i{font-style:normal;font-size:8.5px;letter-spacing:.14em;color:rgba(255,255,255,.55);margin-top:3px;height:9px}
.ph-act{display:flex;justify-content:center;gap:14px;align-items:center;margin-top:4px}
.ph-call,.ph-end{width:64px;height:64px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center}
.ph-call{background:#1FA855;box-shadow:0 8px 20px rgba(31,168,85,.45)} .ph-call:disabled{opacity:.35;box-shadow:none}
.ph-end{background:#E5384F;box-shadow:0 8px 20px rgba(229,56,79,.45)}
.ph-call svg,.ph-end svg{width:26px;height:26px}
.ph-av{width:84px;height:84px;border-radius:50%;margin:14px auto 8px;background:var(--grad);color:var(--on-grad);display:grid;place-items:center;font-size:28px;font-weight:700}
.ph-st{font-size:12px;color:#A9A3CC;margin-top:2px}
.ph-t{font-size:30px;margin:6px 0 10px}
.ph-pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.ph-pills span{font-size:10.5px;padding:2px 9px;border-radius:12px;background:rgba(255,255,255,.1);display:inline-flex;gap:5px;align-items:center}
.ph-pills .rec i{width:7px;height:7px;border-radius:50%;background:#FF5C6F;display:inline-block;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.ph-ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.ph-ctl button{border:0;background:transparent;color:#F1EEFF;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ph-ctl button span{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.ph-ctl button.on span{background:#fff;color:#16112E}
.ph-ctl svg{width:22px;height:22px}
#callpill{position:fixed;right:18px;bottom:18px;z-index:55;display:none;align-items:center;gap:8px;border:0;border-radius:24px;padding:9px 14px;background:#1FA855;color:#fff;font-weight:600;box-shadow:0 10px 26px rgba(31,168,85,.5)}
#callpill.on{display:inline-flex}
#callpill .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@media (max-width:760px){#callpill{bottom:calc(var(--tb,64px) + 14px)}}

/* --- contactos: listas y selección --- */
.tabs .lpen{border:0;border-bottom:2px solid transparent;margin-left:-8px;padding:8px 6px;color:var(--muted);align-self:center}
.tabs .lpen svg{width:13px;height:13px}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;margin-bottom:10px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.selbar .sp{flex:1}
tr.row.sel td{background:var(--accent-soft)}
td input[type=checkbox],th input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}

/* --- oportunidades: filtro, color de etapa y editor de etapas --- */
.col h3.colh{align-items:center;gap:8px}
.col h3.colh.c{background:var(--sc);color:#fff;border-radius:10px;padding:7px 10px;margin:0 0 8px}
.col h3.colh.c .muted{color:rgba(255,255,255,.88)}
.col h3.colh.c .pill{background:rgba(255,255,255,.22);color:#fff}
.ofp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.ofp label{font-size:11px;color:var(--muted);display:grid;gap:3px;font-weight:600}
.strow{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.strow .inp{flex:1 1 140px;min-width:0}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--sc,transparent);display:grid;place-items:center;padding:0;flex:none;color:var(--muted)}
.swatch svg{width:12px;height:12px}
.palette{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px 36px}
.palette>button:not(.btn){width:24px;height:24px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;color:#fff;padding:0}
.palette>button svg{width:12px;height:12px}

/* --- conexiones: tarjetas con logo --- */
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:16px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.ccard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ccard .top{display:flex;gap:12px;align-items:center}
.clogo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.clogo svg{width:24px;height:24px}
.ccard h3{font-size:13.5px}
.ccard p{margin:0;min-height:48px}

/* --- créditos IA --- */
.crbal{display:grid;grid-template-columns:auto 1px minmax(180px,1fr) auto;gap:22px;align-items:center;padding:20px 22px}
.crbal .big{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1}
.crbal .vl{background:var(--line);align-self:stretch}
.crbar{height:7px;border-radius:5px;background:var(--surface2);overflow:hidden;margin:8px 0 5px}
.crbar i{display:block;height:100%;background:var(--grad);border-radius:5px}
.crwarn{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--warn-soft);color:var(--warn);margin:14px 0}
.crwarn.crit{background:var(--crit-soft);color:var(--crit)}
.crwarn div{flex:1}
.crpk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pkg{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pkg.pop{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pkg .tag{position:absolute;top:-10px;right:14px;background:var(--grad);color:var(--on-grad);font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:9px}
.pkg .pr{font-size:26px;font-weight:800;letter-spacing:-.02em}
.pkgs.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkgopt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;display:grid;gap:2px;text-align:center}
.pkgopt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pkgopt b{font-size:15px} .pkgopt span{font-size:12px}
.cardrow{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.cardrow svg{width:18px;height:18px;color:var(--muted)} .cardrow span:nth-of-type(1){flex:1}
.sumbox{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface2);margin:14px 0}
.sumbox b{font-size:18px}
.mgn{width:92px}
@media (max-width:900px){.crbal{grid-template-columns:1fr;gap:12px}.crbal .vl{display:none}.crpk{grid-template-columns:1fr}}

/* --- apariencia --- */
.brands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:12px}

}

function bars(data,h=150){
  const w=420,mx=Math.max(...data.map(d=>d[1]))*1.15,bw=w/data.length;

  return `<svg class="chart" viewBox="0 0 ${w+30} ${h+26}" width="100%" role="img" aria-label="Gráfico de barras">
   ${ticks.map(t=>{const y=h-t/mx*h;return `<line x1="26" x2="${w+26}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="22" y="${y+3}" text-anchor="end">${t}</text>`}).join('')}
   ${data.map((d,i)=>{const bh=d[1]/mx*h;return `<rect x="${28+i*bw+bw*.2}" y="${h-bh}" width="${bw*.6}" height="${bh}" rx="3" fill="var(--accent)"/><text x="${28+i*bw+bw*.5}" y="${h+14}" text-anchor="middle">${d[0]}</text>`}).join('')}</svg>`;
}

function commOf(s,tot){
  const p=S.plan;
  if(p.type==='pct')return s.v*p.pct/100;
  if(p.type==='fix')return p.fix;
  if(p.type==='hyb')return p.fix+s.v*p.pct/100;
  return s.v*(tot>=p.goal?p.pct2:p.pct)/100;
}

function simDist(q,n){
  const d=q.dist,act=d.m.filter(x=>x.on);if(!act.length)return null;
  const cnt={},seq=[];act.forEach(a=>cnt[a.n]=0);
  const cur={};act.forEach(a=>cur[a.n]=0);const tot=act.reduce((a,x)=>a+Math.max(1,x.w),0);
  let i=0;
  while(seq.length<n){
    let pick;
    if(d.mode==='weighted'){act.forEach(a=>cur[a.n]+=Math.max(1,a.w));pick=act.reduce((m,a)=>cur[a.n]>cur[m.n]?a:m,act[0]);cur[pick.n]-=tot}
    else{pick=act[i%act.length];i++}
    for(let b=0;b<Math.max(1,d.batch)&&seq.length<n;b++){seq.push(pick.n);cnt[pick.n]++}
  }
  return {seq,cnt};
}

function parseCSV(t){
  const first=t.split(/\r?\n/)[0];const dl=[',',';','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===dl){r.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}
    else f+=ch}
  if(f!==''||r.length){r.push(f);if(r.some(x=>x.trim()))rows.push(r)}
  return rows;
}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='coltog')ACT.coltog(t);
  else if(t.dataset.set){
    const p=t.dataset.set.split('.');let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];
    const k=p[p.length-1];o[k]=(t.type==='number'||typeof o[k]==='number'||o[k]===null)?Number(t.value):t.value;
    if(t.dataset.set==='saleF.qty')S.saleF.total=null;
    if(t.dataset.live)return;
    if(t.dataset.drawer)refreshDrawer(t.dataset.drawer);else render();
  }
  else if(t.dataset.act==='stagesel')ACT.stagesel(t)
  else if(t.dataset.act==='tagadd')ACT.tagadd(t)
  else if(t.dataset.act==='saleprod')ACT.saleprod(t)
  else if(t.dataset.act==='rolesel')ACT.rolesel(t)
  else if(t.dataset.act==='pipename'){const P=curPipe(),old=P.n,v=t.value.trim();if(!v||(v.toLowerCase()!==old.toLowerCase()&&S.pipes.some(p=>p.n.toLowerCase()===v.toLowerCase()))){toast(v?'Ya existe un pipeline con ese nombre':'El nombre no puede quedar vacío');openPipe();return}P.n=v;S.contacts.forEach(c=>{if(c.pipeline===old)c.pipeline=v});S.forms.forEach(f=>{if(f.pipe===old)f.pipe=v});if(S.imp.pipe===old)S.imp.pipe=v;render()}
  else if(t.dataset.act==='stname'){const P=curPipe(),i=+t.dataset.v,old=P.stages[i],v=t.value.trim();if(!v||(v.toLowerCase()!==old.toLowerCase()&&P.stages.some(s=>s.toLowerCase()===v.toLowerCase()))){toast(v?'Esa etapa ya existe en este pipeline':'El nombre no puede quedar vacío');openPipe();return}
    P.stages[i]=v;if(P.colors&&P.colors[old]){P.colors[v]=P.colors[old];delete P.colors[old]}if(P.won===old)P.won=v;if(P.apt===old)P.apt=v;P.hidden=(P.hidden||[]).map(x=>x===old?v:x);S.contacts.forEach(c=>{if(pipeOf(c.id)===P&&S.stageOf[c.id]===old)S.stageOf[c.id]=v});S.forms.forEach(f=>{if(f.pipe===P.n&&f.stage===old)f.stage=v});openPipe();render()}
  else if(t.dataset.act==='dlfile')ACT.dlfile(t)
  else if(t.dataset.act==='impfile'){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadImport(f.name,String(r.result));r.readAsText(f)}
  else if(t.dataset.bind){
    if(t.dataset.bind==='agent.pers'||t.dataset.bind==='agent.obj'||t.dataset.bind==='agent.info')return;
    setPath(t.dataset.bind,t.value);render();
  } else if(t.dataset.act==='ovrval'){
    const o=S.ovr[S.openOpp];
    if(t.dataset.extra==='1')o.extra[t.dataset.k]=t.value;else o.vals[t.dataset.k]=t.value;
    openOppDrawer(S.openOpp);if(S.view==='opps')render();
  }
});

/* ---------- transferir / compartir ---------- */
function openXfer(){
  const cv=conv(),ct=cName(cv.cid),X=S.xf;cv.shared=cv.shared||[];
  const taken=[ct.owner,...cv.shared.map(s=>s.n)];
  const cand=ADV.filter(n=>X.mode==='transfer'?n!==ct.owner:!taken.includes(n));
  if(!cand.includes(X.to))X.to=cand[0]||'';
  const qn=convQ(cv);
  const row=n=>{const u=S.users.find(x=>x.n===n)||{queues:[]},inq=u.queues.includes(qn),[st,cls]=ADVSTAT[n]||['Disponible','ok'];const load=S.convs.filter(c=>c.st!=='closed'&&cName(c.cid).owner===n).length;
    return `<button class="advr ${X.to===n?'on':''}" data-act="xfpick" data-v="${esc(n)}"><span class="rad"></span><div class="avatar" style="width:34px;height:34px;font-size:12px">${ini(n)}</div><div style="flex:1;min-width:0"><b>${n}</b><div class="muted xs"><span class="st" style="background:var(--${cls})"></span>${st} · ${load} chat${load===1?'':'s'} activo${load===1?'':'s'} · ${inq?'está en la cola':'<span style="color:var(--warn)">fuera de la cola «'+esc(qn)+'»</span>'}</div></div></button>`};
  const tr=X.mode==='transfer';
  $('#drawer').innerHTML=`<header><div class="avatar">${ini(ct.name)}</div><div style="flex:1"><h2>${tr?'Transferir':'Compartir'} conversación</h2><div class="muted sm">${ct.name} · asignado a ${ct.owner==='—'?'nadie':ct.owner}</div></div><button class="iconbtn" data-act="closedrawer" aria-label="Cerrar">${ico('x')}</button></header><div class="body">
   <div class="seg2"><button class="${tr?'on':''}" data-act="xfmode" data-v="transfer">${ico('swap')}Transferir</button><button class="${!tr?'on':''}" data-act="xfmode" data-v="share">${ico('share')}Compartir</button></div>
   <div class="sm" style="margin-bottom:10px;color:var(--muted)">${tr?'El lead <b style="color:var(--fg)">cambia de dueño</b>: el nuevo asesor queda como responsable, y con él van el SLA y la comisión. Queda en el historial.':'Sigues siendo el <b style="color:var(--fg)">dueño del lead</b> (SLA y comisión no cambian). El otro asesor ve el mismo chat y puede ayudarte. Puedes quitarle el acceso cuando quieras.'}</div>
   <div class="up" style="margin-bottom:6px">${tr?'Transferir a':'Compartir con'}</div>
   <div class="advl">${cand.map(row).join('')||'<div class="muted sm">No hay más asesores disponibles para esta acción.</div>'}</div>
   ${tr?`<div class="kv" style="align-items:center;margin-top:10px"><span style="color:var(--fg)">Seguir con acceso como colaborador</span>${sw(X.keep,'xf.keep',true).replace('data-drawer="1"','data-drawer="xfer"')}</div>`:`<label class="sm" style="display:block;margin-top:10px">Permiso del asesor <select class="inp" data-set="xf.perm" data-drawer="xfer"><option value="reply" ${X.perm==='reply'?'selected':''}>Puede responder al cliente</option><option value="view" ${X.perm==='view'?'selected':''}>Solo ver y dejar notas internas</option></select></label>`}
   <label class="sm" style="display:block;margin-top:10px">Nota para el asesor (opcional) <input class="inp" value="${esc(X.note)}" data-live="1" data-set="xf.note" placeholder="Ej.: pidió precio, quiere pagar en cuotas"></label>
   ${cv.shared.length?`<div class="up" style="margin:14px 0 6px">Compartida con</div>${cv.shared.map(s=>`<div class="kv" style="align-items:center"><span style="color:var(--fg)"><b>${s.n}</b> · <span class="muted">${s.perm==='view'?'solo ver':'puede responder'}</span></span><button class="btn sm" data-act="unshare" data-v="${esc(s.n)}">Quitar acceso</button></div>`).join('')}`:''}
   <div class="row-flex" style="margin-top:16px"><button class="btn pri" data-act="xfgo" ${X.to?'':'disabled'}>${tr?'Transferir':'Compartir'}${X.to?' con '+X.to.split(' ')[0]:''}</button><button class="btn" data-act="closedrawer">Cancelar</button></div></div>`;
  openD(true);
}

const lastOf=c=>{const a=c.msgs.filter(m=>!m.sched);return a[a.length-1]||c.msgs[c.msgs.length-1]};
const prevTxt=m=>m.a?'Audio':m.f?(m.f.k==='img'?'Foto':m.f.k==='vid'?'Video':m.f.n):m.t;
function convList(){
  const iq=(S.iq||'').toLowerCase(),F=S.fl;
  return S.convs.filter(c=>{
    const p=cName(c.cid);
    if(c.st!==S.inTab)return false;
    if(!isAdm()&&p.owner!==ME&&!(c.shared||[]).some(s=>s.n===ME))return false;
    if(S.iQueue&&convQ(c)!==S.iQueue)return false;
    if(isAdm()&&F.adv&&p.owner!==F.adv)return false;
    if(F.src&&CH[c.ch][0]!==F.src)return false;
    if(F.tag&&!(c.tags||[]).includes(F.tag))return false;
    if(F.unread&&!c.unread)return false;
    if(F.sla){const left=c.deadline-Date.now(),open=c.done===null;
      if(F.sla==='late'&&!(open&&left<0))return false;
      if(F.sla==='risk'&&!(open&&left>=0&&left<3*60000))return false;
      if(F.sla==='ok'&&!(c.done!==null||left>=3*60000))return false}
    return !iq||(p.name+' '+prevTxt(lastOf(c))).toLowerCase().includes(iq);
  });
}
const flCount=()=>[S.iQueue,isAdm()&&S.fl.adv,S.fl.src,S.fl.tag,S.fl.sla].filter(Boolean).length+(S.fl.unread?1:0);
function flChips(){
  const F=S.fl,a=[];
  if(S.iQueue)a.push(['q','Cola: '+S.iQueue]);
  if(isAdm()&&F.adv)a.push(['adv','Asesor: '+(F.adv==='—'?'Sin asignar':F.adv)]);
  if(F.src)a.push(['src','Fuente: '+F.src]);
  if(F.tag)a.push(['tag','Etiqueta: '+F.tag]);
  if(F.sla)a.push(['sla',{late:'SLA vencido',risk:'SLA en riesgo',ok:'SLA al día'}[F.sla]]);
  if(F.unread)a.push(['unread','No leídos']);
  return a;
}

function dRange(){

  if(R==='7d')a.setDate(a.getDate()-6);else if(R==='30d')a.setDate(a.getDate()-29);else if(R==='mtd')a=new Date(2025,9,1);

    if(!isNaN(f)&&!isNaN(t)){a=f<=t?f:t;b=f<=t?t:f;if(b>T0)b=new Date(T0);if(a>b)a=new Date(b);const mn=new Date(b);mn.setDate(mn.getDate()-91);if(a<mn)a=mn}}
  return [a,b];
}
const K0=Math.floor(T0.getTime()/864e5);
const dayV=d=>{const k=Math.floor(d.getTime()/864e5),w=d.getDay();return Math.round(((w===0?260:w===6?520:700)+(Math.sin(k*1.7)+1)*380+((k*37)%11)*45)*(1+(k-K0)/420))};
const dayL=d=>{const k=Math.floor(d.getTime()/864e5);return Math.max(1,3+((k*13)%7)-(d.getDay()===0?2:0))};
function dStats(a,b,f){
  const days=[];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))days.push(new Date(d));
  const sold=Math.round(days.reduce((s,d)=>s+dayV(d),0)*f),leads=Math.round(days.reduce((s,d)=>s+dayL(d),0)*f),
    ventas=Math.max(0,Math.round(days.reduce((s,d)=>s+Math.round(dayV(d)/520),0)*f));

}

function rptData(){

  const lbl=fmtD(a)+' – '+fmtD(b)+' 2025',tk=C.ventas?Math.round(C.sold/C.ventas):0;

  let cols,rows;
  if(tab==='sum'){cols=['Métrica','Valor','Vs. período anterior'];rows=[['Valor generado en ventas',C.sold,D.dSold+' %'],['Cobrado',C.cob,''],['Por cobrar',C.sold-C.cob,''],['Ventas cerradas',C.ventas,''],['Ticket promedio',tk,''],['Leads nuevos',C.leads,D.dLeads+' %']]}
  else if(tab==='rt'){cols=['Asesor','En línea','Abiertas','Pendientes','Espera media'];rows=[['Marcela R.','Sí',4,1,'06:10'],['Diego T.','Sí',2,0,'03:42'],['Paola S.','No',0,0,'—']]}
  else if(tab==='sales'){cols=['Cliente','Producto','Total','Abono','Saldo','Fecha','Estado','Asesor'];rows=S.sales.map(s=>[s.cl,s.p,s.v,s.dep!=null?s.dep:s.v,s.bal!=null?s.bal:0,s.d,s.st==='paid'?'Pagada':'Con saldo',ADV[s.a||0]])}
  else if(tab==='conv'){const sh=[.42,.33,.25],rt=[.31,.22,.27];cols=['Asesor','Leads','Ventas','Conversión %'];rows=ADV.map((n,i)=>{const l=Math.round(C.leads*sh[i]),v=Math.round(l*rt[i]);return [n,l,v,l?Math.round(v/l*100):0]})}
  else{cols=['Evento','Cuándo se dispara','Enviados (30 d)'];rows=[['Lead','Un contacto nuevo escribe primero',96],['Schedule','Se agenda una cita',21],['Purchase','Se registra una venta (valor total)',21]]}
  return {tab,title:names[tab],lbl,cols,rows};

const csvCell=v=>{const s=String(v==null?'':v);return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
async function downloadReport(){
  const R=rptData(),csv='﻿'+[['Reporte',R.title],['Período',R.lbl],['Generado','2025-10-02'],['Nota','Datos de ejemplo del prototipo']].map(r=>r.map(csvCell).join(',')).join('\n')+'\n\n'+[R.cols,...R.rows].map(r=>r.map(csvCell).join(',')).join('\n');
  const fn='reporte-'+R.tab+'-'+R.lbl.replace(/[^0-9a-zñ]+/gi,'_')+'.csv';

Object.assign(ACT,{
 buyopen(t){S.buy.pkg=t&&t.dataset&&t.dataset.v!=null?+t.dataset.v:S.buy.pkg;S.buy.card=0;openBuy()},
 buypkg(t){S.buy.pkg=+t.dataset.v;openBuy()},
 buygo(){const id=curOrg().id,W=walletOf(id),p=S.ai.pkgs[S.buy.pkg],pr=pkgPrice(p,id),c=W.cards[S.buy.card];if(!c)return;

 addcard(t){S.cardF={back:t.dataset.v==='buy'?'buy':'wallet'};openCardForm()},
 cardback(){if(S.cardF&&S.cardF.back==='buy')openBuy();else closeDrawer()},
 cardsave(){const n=($('#cf_num').value||'').replace(/\D/g,''),ex=$('#cf_exp').value.trim();
  if(n.length<13){toast('Revisa el número de tarjeta');return}
  if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(ex)){toast('La fecha de vencimiento debe ser MM/AA');return}

  const W=walletOf(curOrg().id),b=n[0]==='4'?'Visa':n[0]==='5'?'Mastercard':n[0]==='3'?'Amex':'Tarjeta';
  W.cards.push({b,l:n.slice(-4),e:ex});S.buy.card=W.cards.length-1;toast(b+' •••• '+n.slice(-4)+' agregada');
  if(S.cardF&&S.cardF.back==='buy')openBuy();else{closeDrawer();render()}},
 rmcard(t){const W=walletOf(curOrg().id);const c=W.cards.splice(+t.dataset.v,1)[0];if(W.auto.on&&!W.cards.length)W.auto.on=false;render();toast('Tarjeta •••• '+c.l+' eliminada')},
 byoopen(){openByo()},byooff(){walletOf(curOrg().id).byo=false;render();toast('Volviste a usar créditos')},
 byosave(){const k=($('#byo_k').value||'').trim();if(k.length<8){toast('Pega tu clave de API');return}walletOf(curOrg().id).byo=true;closeDrawer();render();toast('Clave guardada y cifrada. Tus agentes ya no gastan créditos.')}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==='buycard'){S.buy.card=+t.dataset.v;openBuy()}
  else if(a==='autoth'){walletOf(curOrg().id).auto.th=+t.value;render()}
  else if(a==='autopkg'){walletOf(curOrg().id).auto.pkg=+t.value;render()}
  else if(a==='orgmargin'){const w=walletOf(t.dataset.v),v=t.value.trim();w.margin=v===''?null:Math.max(0,Math.min(1000,Number(v)||0));render();toast('Margen de «'+orgName(t.dataset.v)+'» actualizado. El cliente no lo ve.')}
  else if(a==='aicost'){S.ai.cost=Math.max(0.0001,Number(t.value)||S.ai.cost);render()}
  else if(a==='aimargin'){S.ai.margin=Math.max(0,Math.min(1000,Number(t.value)||0));render()}
  else if(a==='pkgc'){S.ai.pkgs[+t.dataset.v].c=Math.max(1,Math.round(Number(t.value)||1));render()}
  else if(a==='pkgd'){S.ai.pkgs[+t.dataset.v].disc=Math.max(0,Math.min(90,Number(t.value)||0));render()}
  else if(a==='rate'){S.ai.rates[t.dataset.v]=Math.max(1,Math.round(Number(t.value)||1));render()}
  else if(a==='grantorg'){S.grant.org=t.value}
  else if(a==='grantwhy'){S.grant.why=t.value}
});

/* respuestas simuladas */
const hhmm=()=>new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit',hour12:false});
function agentReply(a,txt,kind){
  const who=S.contacts.find(c=>c.id===S.agWho)||S.contacts[0],fn=who.name.split(' ')[0],log=[];
  const docs=S.kb.filter(d=>a.kb.includes(d.id)&&d.st==='ready'&&d.on);
  const has=n=>docs.find(d=>d.n.includes(n));
  let r='',t=txt.toLowerCase(),xfer=false;
  if(kind==='aud'){if(!a.audio)return{parts:['Ahora no puedo escuchar audios 🙏 ¿Me lo escribes por favor?'],log:[{k:'w',t:'Audio recibido pero «Escucha notas de audio» está apagado'}]};log.push({k:'t',t:'Transcribió el audio: «¿Cuánto cuesta el curso?»'});t='cuánto cuesta'}
  if(kind==='img'){if(!a.images)return{parts:['No puedo ver imágenes por aquí. ¿Me cuentas qué necesitas?'],log:[{k:'w',t:'Imagen recibida pero «Lee imágenes» está apagado'}]};return{parts:['Gracias por la foto, '+fn+'. Veo un comprobante de pago. Un asesor lo confirmará para reservar tu cupo.'],log:[{k:'t',t:'Analizó la imagen (comprobante)'},{k:'',t:'Sugirió revisión humana: el agente no confirma pagos'}]}}
  if(!a.on)return{parts:[],log:[{k:'w',t:'Agente pausado: en producción no respondería'}]};
  if(/asesor|humano|persona|agente real/.test(t)){
    if(a.transfer){xfer=true;r='Claro, '+fn+'. Te paso con un asesor de '+a.queue+' ahora mismo.';log.push({k:'t',t:'Función transferir_a_humano → cola «'+a.queue+'»'})}
    else{r='Por ahora yo te ayudo con eso, '+fn+'. ¿Qué necesitas saber?';log.push({k:'w',t:'Pidió humano pero «Transferencia a humano» está apagada'})}
  }else if(/precio|cuest|cuánto|cuanto|valor/.test(t)){
    const d=has('Precios');
    if(d){r='El Curso de Uñas cuesta $2.000 e incluye kit de materiales.'+(a.showSrc?' (Fuente: '+d.n+', hoja «Cursos»).':'')+' ¿Te cuento las fechas?';log.push({k:'t',t:'Consultó «'+d.n+'» (3 fragmentos relevantes)'})}
    else{r='No tengo los precios a mano. ¿Quieres que te comunique con un asesor?';log.push({k:'w',t:'Sin documento de precios asignado: no inventó el dato'})}
  }else if(/cupo|disponib|fecha|inicio/.test(t)){
    const d=has('Precios')||has('Catálogo');
    if(d){r='Quedan 6 cupos para el grupo de octubre. Empieza el lunes 14.';log.push({k:'t',t:'Consultó «'+d.n+'»'})}
    else{r='No tengo las fechas a mano, ¿te comunico con un asesor?';log.push({k:'w',t:'Sin documento de cupos asignado'})}
  }else if(/hola|buen/.test(t)){r='¡Hola '+fn+'! Soy '+a.name+'. ¿Desde qué ciudad nos escribes y qué te interesa?';log.push({k:'',t:'Usó {{contact.nombre}} = '+fn})}
  else{r='Entiendo, '+fn+'. Para ayudarte mejor, ¿confirmas que estás en '+who.city+' y te interesa '+who.interest+'?';log.push({k:'',t:'Siguió el objetivo: confirmar ciudad e interés'})}
  if(r.length>a.maxChars)r=r.slice(0,a.maxChars-1)+'…';
  let parts=[r];
  if(a.splitOn&&a.split>1){const ss=r.split(/(?<=[.?!])\s+/);if(ss.length>1){const n=Math.min(a.split,ss.length),sz=Math.ceil(ss.length/n);parts=[];for(let k=0;k<ss.length;k+=sz)parts.push(ss.slice(k,k+sz).join(' '));log.push({k:'',t:'Dividió la respuesta en '+parts.length+' mensajes'})}}
  if(a.voice)log.push({k:'',t:'Respondió como nota de voz (motor de voz)'});
  return{parts,log,xfer};

     <button class="btn ${g.annOnly?'':'pri'}" data-act="gtoggle" data-k="annOnly" ${lk(m,'Requiere administrar participantes')}>Todos envían</button><button class="btn ${g.lock?'':'pri'}" data-act="gtoggle" data-k="lock" ${lk(m,'Requiere administrar participantes')}>Todos editan</button><button class="btn ${g.crm?'pri':''}" data-act="gtoggle" data-k="crm" ${lk(m,'Requiere administrar participantes')}>En el CRM</button></div>
    ${m?'':`<div class="xs muted" style="margin-top:8px">${ico('lock').replace('<svg','<svg style="width:12px;height:12px;vertical-align:-2px"')} No tienes permiso para administrar participantes. Solo lectura.</div>`}</div>
   ${m?`<div class="card pad"><div class="row-flex"><h3 style="margin:0">Agregar participante</h3><span class="sp"></span><label class="btn sm" style="cursor:pointer">${ico('upload')}Importar CSV<input type="file" id="gcsv" accept=".csv,text/csv,text/plain" hidden></label></div>
    <div class="row-flex" style="margin-top:8px;flex-wrap:nowrap"><input class="inp mono" id="gnum" placeholder="593987654321" inputmode="numeric" aria-label="Número con código de país"><button class="btn pri" data-act="gadd" aria-label="Agregar">${ico('plus')}</button></div>
    <div class="xs muted" style="margin-top:6px">Consejo: usa «Importar CSV» para agregar varios números a la vez. Cada número con código de país (593…).</div>
    ${R.imp?`<div class="pill ${R.imp.bad?'warn':'ok'}" style="margin-top:8px">CSV: ${R.imp.ok} agregados · ${R.imp.dup} repetidos · ${R.imp.bad} inválidos</div>`:''}</div>`:''}
   <div class="card pad"><div class="row-flex"><h3 style="margin:0">Participantes <span class="pill acc">${g.pc} en total</span></h3><span class="sp"></span>${m?`<button class="btn sm pri" data-act="gdl">${ico('download')}Descargar CSV</button>`:''}</div>
    <div style="margin-top:8px;max-height:260px;overflow:auto">${ps.map((p,i)=>`<div class="kv" style="align-items:center"><span class="mono" style="color:var(--fg)">${p.p}</span><span style="display:flex;gap:6px;align-items:center">${p.adm?'<span class="pill info">Admin</span>':''}${m?`<button class="btn sm" data-act="gadm" data-i="${i}">${p.adm?'Quitar admin':'Hacer admin'}</button><button class="btn sm dng" data-act="grm" data-i="${i}" aria-label="Eliminar participante">${ico('trash')}</button>`:''}</span></div>`).join('')}${g.more?`<div class="xs muted" style="padding:8px 0">Mostrando ${ps.length} de ${g.pc}. El resto se carga por páginas en la versión real.</div>`:''}</div></div>
  </div></div>`;
  openD('modal');
}
function gSnap(){const e=$('#gs_txt');if(e)S.gr.send.txt=e.value;[['gs_date','date'],['gs_time','time'],['gs_freq','freq'],['gs_end','end']].forEach(([i,k])=>{const x=$('#'+i);if(x)S.gr.send[k]=x.value})}
function openGroupSend(){
  const R=S.gr,g=gGet(R.sel),d=R.send,qr=gConn();if(!g)return;
  const WD=['L','M','X','J','V','S','D'];
  $('#drawer').innerHTML=mhead('Enviar mensaje al grupo',esc(g.n))+`<div class="body"><div class="grid" style="gap:12px">
   <div class="row-flex" style="flex-wrap:wrap">${[['now','Enviar ahora'],['later','Programar envío'],['rec','Recurrente']].map(x=>`<button class="btn ${d.mode===x[0]?'pri':''}" data-act="gsmode" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
   ${d.mode==='later'?`<div class="row-flex" style="flex-wrap:nowrap"><label class="sm" style="flex:1">Fecha<input class="inp" type="date" id="gs_date" value="${d.date||'2026-10-06'}"></label><label class="sm" style="flex:1">Hora<input class="inp" type="time" id="gs_time" value="${d.time||'09:00'}"></label></div>`:''}
   ${d.mode==='rec'?`<div class="grid" style="gap:8px"><div class="row-flex" style="flex-wrap:nowrap"><label class="sm" style="flex:1">Frecuencia<select class="inp" id="gs_freq" data-act="gsfreq">${opt(['Cada día','Cada semana','Cada mes'],d.freq||'Cada semana')}</select></label><label class="sm" style="flex:1">Hora<input class="inp" type="time" id="gs_time" value="${d.time||'09:00'}"></label></div>
    ${(d.freq||'Cada semana')==='Cada semana'?`<div class="row-flex" style="gap:6px">${WD.map((w,i)=>`<button class="btn sm ${d.wd.includes(i)?'pri':''}" data-act="gswd" data-v="${i}" aria-pressed="${d.wd.includes(i)}">${w}</button>`).join('')}</div>`:''}
    <label class="sm">Termina<select class="inp" id="gs_end">${opt(['Nunca','En 1 mes','En 3 meses'],d.end||'Nunca')}</select></label></div>`:''}
   <label class="sm">Mensaje<textarea class="inp" id="gs_txt" rows="4" placeholder="Escribe tu mensaje…">${esc(d.txt||'')}</textarea></label>
   <div class="card pad"><div class="sm" style="font-weight:600">${ico('clip').replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px"')} Adjuntar multimedia (opcional)</div><div class="row-flex" style="margin-top:8px;flex-wrap:wrap">${[['img','Imagen','image','image/*'],['vid','Vídeo','video','video/*'],['aud','Audio','mic','audio/*'],['doc','Documento','file','']].map(x=>`<label class="btn sm" style="cursor:pointer">${ico(x[2])}${x[1]}<input type="file" hidden data-gfile="${x[0]}" ${x[3]?`accept="${x[3]}"`:''}></label>`).join('')}</div>
    ${d.files.length?`<div style="margin-top:8px">${d.files.map((f,i)=>`<div class="kv" style="align-items:center"><span class="sm">${ico('file').replace('<svg','<svg style="width:13px;height:13px;vertical-align:-2px"')} ${esc(f.n)}</span><button class="btn sm" data-act="gsrmf" data-i="${i}" aria-label="Quitar adjunto">${ico('x')}</button></div>`).join('')}</div>`:''}</div>
   <div class="kv" style="align-items:center"><span>Mencionar @todos en el grupo</span><button class="sw ${d.mention?'on':''}" data-act="gsment" role="switch" aria-checked="${d.mention}" aria-label="Mencionar a todos"></button></div>
   ${qr?`<div class="xs muted">Conexión ${esc(qr.n)} (no oficial): los envíos recurrentes y las menciones a todos aumentan el riesgo de bloqueo.</div>`:''}
   <div class="row-flex" style="justify-content:flex-end;flex-wrap:wrap"><button class="btn" data-act="gsback">Cancelar</button><button class="btn pri" data-act="gsgo">${ico(d.mode==='now'?'send':d.mode==='later'?'clock':'swap').replace('<svg','<svg style="width:15px;height:15px"')}${{now:'Enviar ahora',later:'Programar envío',rec:'Guardar recurrente'}[d.mode]}</button></div></div></div>`;
  openD('modal');
}
function openGSched(){
  const mine=S.gr.sched.filter(x=>S.role!=='advisor'||x.by===ME);
  $('#drawer').innerHTML=mhead('Mensajes programados','Envíos a grupos pendientes')+`<div class="body"><div class="grid" style="gap:10px">${mine.map(x=>{const g=gGet(x.g);return `<div class="card pad"><div class="row-flex" style="flex-wrap:nowrap;align-items:flex-start"><div style="flex:1;min-width:0"><b>${esc(g?g.n:'Grupo')}</b><div class="sm" style="margin-top:2px">${esc(x.txt)}</div><div class="xs muted" style="margin-top:4px">${ico('clock').replace('<svg','<svg style="width:12px;height:12px;vertical-align:-2px"')} ${x.when} · ${esc(x.by)}</div></div><span class="pill ${x.kind==='rec'?'info':'warn'}">${x.kind==='rec'?'Recurrente':'Programado'}</span></div><div style="margin-top:8px"><button class="btn sm dng" data-act="gschedx" data-v="${x.id}">Cancelar envío</button></div></div>`}).join('')||'<div class="muted sm" style="text-align:center;padding:20px">No hay mensajes programados.</div>'}</div></div>`;
  openD('modal');
}
function openGCreate(){
  $('#drawer').innerHTML=mhead('Crear grupo','Se crea con tu número WhatsApp QR')+`<div class="body"><div class="grid" style="gap:12px">
   <label class="sm">Nombre del grupo<input class="inp" id="gc_n" placeholder="Ej. Promoción noviembre"></label><label class="sm">Descripción (opcional)<textarea class="inp" id="gc_d" rows="2"></textarea></label>
   <label class="sm">Participantes iniciales (uno por línea, con código de país)<textarea class="inp mono" id="gc_p" rows="4" placeholder="593987654321"></textarea></label>
   <div class="xs muted">WhatsApp limita cuántos participantes se pueden agregar de golpe. En la versión real se agregan en lotes.</div>
   <div class="row-flex" style="justify-content:flex-end"><button class="btn" data-act="closedrawer">Cancelar</button><button class="btn pri" data-act="gcreatego">Crear grupo</button></div></div></div>`;
  openD('modal');
}
const gDigits=v=>String(v).replace(/[^\d]/g,'');
const gFmt=d=>'+'+d.slice(0,3)+' '+d.slice(3,5)+' '+d.slice(5,8)+' '+d.slice(8);
Object.assign(ACT,{
 gopen(t){S.gr.imp=null;openGroup(t.dataset.v)},
 gtab(t){S.gr.tab=t.dataset.v;render()},gview(t){S.gr.v=t.dataset.v;render()},
 gcrmall(){S.gr.crm=!S.gr.crm;const q=gConn();if(q)q.groups=S.gr.crm;render();toast(S.gr.crm?'Los grupos marcados aparecerán como conversaciones en el CRM':'Los grupos dejan de mostrarse en el CRM')},
 gsyncgo(){S.gr.sync='hace unos segundos';render();toast('Grupos sincronizados con tu número (simulado)')},
 gtoggle(t){const g=gGet(S.gr.sel);if(!g||!gP.m())return;g[t.dataset.k]=!g[t.dataset.k];openGroup(g.id)},
 glink(t){const g=gGet(t.dataset.v);try{navigator.clipboard&&navigator.clipboard.writeText(g.link)}catch(e){}toast('Link de invitación copiado: '+g.link)},
 gadd(){const g=gGet(S.gr.sel);if(!g||!gP.m())return;const d=gDigits(($('#gnum')||{}).value||'');
  if(d.length<10||d.length>15){toast('Número inválido: usa código de país y solo dígitos (ej. 593987654321)');return}
  const f=gFmt(d);if(gParts(g).some(p=>p.p===f)){toast('Ese número ya está en el grupo');return}
  g.parts.push({p:f,adm:false});g.pc++;S.gr.imp=null;openGroup(g.id);toast('Participante agregado (simulado)')},
 grm(t){const g=gGet(S.gr.sel);if(!g||!gP.m())return;const p=g.parts[+t.dataset.i];if(!p)return;if(p.adm)g.ad--;g.parts.splice(+t.dataset.i,1);g.pc--;openGroup(g.id);toast('Participante eliminado (simulado)')},
 gadm(t){const g=gGet(S.gr.sel);if(!g||!gP.m())return;const p=g.parts[+t.dataset.i];if(!p)return;p.adm=!p.adm;g.ad+=p.adm?1:-1;openGroup(g.id)},
 gdl(){const g=gGet(S.gr.sel);if(!g||!gP.m())return;const csv='numero,rol\n'+gParts(g).map(p=>p.p.replace(/\s/g,'')+','+(p.adm?'admin':'participante')).join('\n');
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='participantes-'+g.n.replace(/\W+/g,'-').toLowerCase()+'.csv';document.body.appendChild(a);a.click();a.remove()}catch(e){}toast('CSV de participantes descargado (datos de ejemplo)')},
 gsendopen(){if(!gP.s())return;S.gr.send=Object.assign({mode:'now',files:[],mention:false,wd:[1]},{txt:''});openGroupSend()},
 gsmode(t){gSnap();S.gr.send.mode=t.dataset.v;openGroupSend()},
 gsfreq(){gSnap();openGroupSend()},
 gswd(t){gSnap();const w=S.gr.send.wd,i=+t.dataset.v;S.gr.send.wd=w.includes(i)?w.filter(x=>x!==i):[...w,i].sort();openGroupSend()},
 gsment(){gSnap();S.gr.send.mention=!S.gr.send.mention;openGroupSend()},
 gsrmf(t){gSnap();S.gr.send.files.splice(+t.dataset.i,1);openGroupSend()},
 gsback(){openGroup(S.gr.sel)},
 gsgo(){
  gSnap();const d=S.gr.send,g=gGet(S.gr.sel);if(!g||!gP.s())return;
  if(!(d.txt||'').trim()&&!d.files.length){toast('Escribe un mensaje o adjunta un archivo');return}
  if(d.mode==='rec'&&(d.freq||'Cada semana')==='Cada semana'&&!d.wd.length){toast('Elige al menos un día de la semana');return}
  if(d.mode==='now'){openGroup(g.id);toast('Mensaje enviado al grupo (simulado): no se envió nada real');return}
  const WD=['L','M','X','J','V','S','D'],when=d.mode==='later'?(d.date||'2026-10-06').split('-').reverse().slice(0,2).join('/')+' '+(d.time||'09:00'):`${(d.freq||'Cada semana')==='Cada semana'?d.wd.map(i=>WD[i]).join(' '):d.freq} ${d.time||'09:00'} · ${(d.freq||'Cada semana').toLowerCase()}`;
  S.gr.sched.unshift({id:Date.now(),g:g.id,txt:d.txt||'(archivo adjunto)',kind:d.mode==='rec'?'rec':'one',when,by:S.role==='advisor'?ME:'Josué Q.',st:'Programado'});
  openGroup(g.id);toast(d.mode==='rec'?'Envío recurrente guardado (simulado)':'Mensaje programado para '+when+' (simulado)')},
 gsched(){if(gP.s())openGSched()},
 gschedx(t){S.gr.sched=S.gr.sched.filter(x=>x.id!==+t.dataset.v);openGSched();toast('Envío cancelado')},
 gcreate(){if(gP.m())openGCreate()},
 gcreatego(){const n=($('#gc_n')||{}).value.trim();if(!n){toast('Ponle un nombre al grupo');return}
  const nums=(($('#gc_p')||{}).value||'').split(/\n/).map(gDigits).filter(x=>x.length>=10&&x.length<=15);const id='g'+(S.gr.groups.length+1);
  S.gr.groups.unshift({id,n,d:($('#gc_d')||{}).value.trim(),pc:nums.length+1,ad:1,mine:true,col:S.gr.groups.length%6,jid:'120363'+String(Date.now()).slice(-12)+'@g.us',link:'https://chat.whatsapp.com/Nw'+Date.now().toString(36),crm:false,annOnly:false,lock:false,parts:null,more:0});
  closeDrawer();render();toast('Grupo creado (simulado) con '+(nums.length+1)+' participante'+(nums.length?'s':''))}
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t||!t.files)return;
  if(t.id==='gcsv'){const f=t.files[0];if(!f)return;const g=gGet(S.gr.sel);if(!g||!gP.m())return;const r=new FileReader();
   r.onload=()=>{const have=new Set(gParts(g).map(p=>p.p));let ok=0,dup=0,bad=0;
    String(r.result).split(/\r?\n/).forEach((ln,i)=>{const c=ln.split(/[;,\t]/)[0];if(!c.trim()||(i===0&&/[a-z]/i.test(c)))return;const d=gDigits(c);if(d.length<10||d.length>15){bad++;return}const fm=gFmt(d);if(have.has(fm)){dup++;return}have.add(fm);g.parts.push({p:fm,adm:false});g.pc++;ok++});
    S.gr.imp={ok,dup,bad};openGroup(g.id);toast('CSV importado (simulado): '+ok+' agregados')};r.readAsText(f);t.value=''}
  else if(t.dataset&&t.dataset.gfile){const f=t.files[0];if(!f)return;gSnap();S.gr.send.files.push({k:t.dataset.gfile,n:f.name});openGroupSend()}
});

document.addEventListener('change',e=>{if(e.target&&e.target.id==='gs_freq')ACT.gsfreq()});

/* --- navegación, perfiles y acciones comunes v9 --- */
VIEWS.sales=vSales;VIEWS.wgroups=vGroups;VIEWS.campaigns=vCampaigns;
Object.assign(ACT,{
 advsel(t){setMe(t.value);S.fl.adv='';render();toast('Ahora ves el prototipo como el asesor '+ME)},
 viewas(t){const n=t.dataset.v||ADV[S.adv];if(!ADVISORS.includes(n)){toast('Ese usuario no es un asesor');return}setMe(n);S.role='advisor';S.org=1;S.fl.adv='';S.view='sales';S.sheet=false;S.openOpp=null;closeDrawer();render();toast('Ves el prototipo como '+n+' (asesor). Cambia el perfil abajo a la izquierda para volver.')},
 saledet(t){openSaleDet(+t.dataset.v)},
 saleask(t){closeDrawer();toast('Solicitud enviada al administrador (simulado). Queda en la auditoría.')}
});
(function(){const o=renderNav;renderNav=function(){o();
  const adv=S.role==='advisor',n=$('#mename'),a=$('#meav'),as=$('#advsel');
  if(n)n.textContent=adv?ME:'Josué Q.';if(a)a.textContent=adv?ini(ME):'JQ';
  if(as){as.style.display=adv?'':'none';as.innerHTML=ADVISORS.map(x=>`<option ${x===ME?'selected':''}>${x}</option>`).join('')}
}})();
document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.act==='advsel')ACT.advsel(t)});
/* ====================== fin v9 ====================== */

$('#themeBtn').innerHTML=ico('moon');
const h=(location.hash||'').replace('#','');if(VIEWS[h])S.view=h;
render();
